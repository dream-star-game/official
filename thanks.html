    <script>
        // 创建容器，只创建一次
        let toastContainer = document.querySelector('.toast-wrap');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.className = 'toast-wrap';
            document.body.appendChild(toastContainer);
        }

        /**
         * 弹出右上角提示
         * @param {string} text 提示文字
         * @param {number} autoClose 自动关闭毫秒，0=不自动关闭
         */
        function showToast(text, autoClose = 3000) {
            const toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerHTML = `
        ${text}
        <span class="toast-close">×</span>
    `;
            toastContainer.appendChild(toast);

            // 触发动画
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            // 关闭函数
            function closeToast() {
                toast.classList.remove('show');
                toast.style.transform = 'translateX(120%)';
                setTimeout(() => toast.remove(), 300);
            }

            //点击×关闭
            toast.querySelector('.toast-close').onclick = closeToast;

            //自动关闭
            if (autoClose > 0) {
                setTimeout(closeToast, autoClose);
            }
        }
        showToast("因编辑组人手有限，如果有您的作品、内容我们未注明时，请加入QQ群联系我们进行修改，尊重创作者个人意愿，我们仅展示部分创作者的平台链接，感谢理解", 0);
    </script>
